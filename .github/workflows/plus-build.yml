name: Kiosk Satellite Plus build

# Builds the APK on every push to main and publishes it as a release, signed
# with the KIOSK_PLUS_KEYSTORE_BASE64 secret: the key the app on the tablet was
# first signed with, so each build installs over the last and the app's own
# updater can install it. Without the secret it builds nothing.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: plus-build
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true

      - name: Signing key from the secret
        id: secret
        env:
          KEYSTORE: ${{ secrets.KIOSK_PLUS_KEYSTORE_BASE64 }}
        working-directory: app/android/app
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > plus-keystore.jks
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      # Without the key the build couldn't install over the app on the tablet, so nothing is published.
      - name: No signing key
        if: steps.secret.outputs.found != 'true'
        run: echo "::warning::KIOSK_PLUS_KEYSTORE_BASE64 isn't set; nothing is built or published."

      - name: Point the build at the key
        if: steps.secret.outputs.found == 'true'
        working-directory: app/android
        run: |
          printf 'storePassword=kioskplus\nkeyPassword=kioskplus\nkeyAlias=plus\nstoreFile=plus-keystore.jks\n' > key.properties

      - name: Check the Plus code
        if: steps.secret.outputs.found == 'true'
        working-directory: app
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings lib/ui/plus_home.dart lib/ui/plus_spicy.dart lib/ui/kiosk_screen.dart

      - name: Build the APK
        if: steps.secret.outputs.found == 'true'
        working-directory: app
        run: |
          VERSION="$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)"
          BUILD="$(sed -n 's/^version:.*+//p' pubspec.yaml)"
          # Above the pubspec's build number, and higher every run, so each build updates the last
          # (the first build, made by hand, was 1).
          CODE=$(( BUILD * 1000 + (GITHUB_RUN_NUMBER + 1) % 1000 ))
          flutter build apk --release --build-name="${VERSION}-plus.${GITHUB_RUN_NUMBER}" --build-number="$CODE"
          # Named as the in-app updater looks for it: kiosk-satellite-v<version>.apk under tag v<version>.
          mv build/app/outputs/flutter-apk/app-release.apk "../kiosk-satellite-v${VERSION}-plus.${GITHUB_RUN_NUMBER}.apk"
          echo "PLUS_VERSION=${VERSION}-plus.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Publish
        if: steps.secret.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${PLUS_VERSION}"
          gh release create "$TAG" "kiosk-satellite-v${PLUS_VERSION}.apk" \
            --target "$GITHUB_SHA" --title "Kiosk Satellite Plus ${PLUS_VERSION}" --latest \
            --notes "Built from $(git log -1 --format=%h). Installs over the last Plus build, and the app offers it as an update (Settings → About)."
